services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: db
      MARIADB_USER: db
      MARIADB_PASSWORD: db
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html
    ports:
      - "${HTTP_PORT:-8000}:80"
    # Install deps (project is bind-mounted, not baked into the image),
    # apply migrations, then start Apache.
    command: >
      sh -c "composer install --no-interaction &&
             bin/console doctrine:migrations:migrate --no-interaction &&
             apache2-foreground"

volumes:
  db_data:
